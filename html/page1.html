<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZuoSuo AI 宣传① 首屏</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 390px;
      height: 683px;
      margin: 5px 2px;
      overflow: hidden;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #0a0a1a 0%, #12122a 50%, #0d0d24 100%);
      color: #fff;
    }
    /* 外容器：可变色边框 */
    .page {
      width: 390px;
      height: 683px;
      padding: 6px;
      position: relative;
      border-radius: 24px;
      background: linear-gradient(135deg, #f7971e, #ffd200, #f7971e, #ffd200, #a064ff, #7c3aed);
      background-size: 400% 400%;
      animation: borderMove 5s ease infinite;
    }
    @keyframes borderMove {
      0% { background-position: 0% 50%; }
      25% { background-position: 100% 0%; }
      50% { background-position: 100% 100%; }
      75% { background-position: 0% 100%; }
      100% { background-position: 0% 50%; }
    }
    /* 内容器：深色背景 + 内容 */
    .inner {
      width: 100%;
      height: 100%;
      border-radius: 21px;
      background: linear-gradient(180deg, #0d0d1e 0%, #151535 50%, #0d0d1e 100%);
      padding: 0 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(255,215,0,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ====== HERO ====== */
    .hero { text-align: center; position: relative; z-index: 1; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 10px 26px;
      border-radius: 20px;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      box-shadow: 0 0 18px rgba(255,215,0,0.3);
      margin-bottom: 22px;
    }
    .hero h1 {
      font-size: 34px;
      font-weight: 800;
      line-height: 1.3;
      background: linear-gradient(135deg, #fff 30%, #ffd200 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 14px;
    }
    .hero p {
      font-size: 15px;
      color: rgba(255,255,255,0.5);
      line-height: 1.8;
    }
    .hero .hl { color: #ffd200; font-weight: 600; }

    /* ====== 核心卖点 ====== */
    .sell-items {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sell-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
    }
    .sell-item .ico { font-size: 20px; flex-shrink: 0; }
    .sell-item.yellow {
      background: linear-gradient(135deg, rgba(255,215,0,0.12), rgba(255,165,0,0.06));
      border: 1px solid rgba(255,215,0,0.15);
      color: #ffd200;
    }
    .sell-item.purple {
      background: linear-gradient(135deg, rgba(160,100,255,0.12), rgba(120,80,200,0.06));
      border: 1px solid rgba(160,100,255,0.15);
      color: #a064ff;
    }

    /* ====== 底部标语 ====== */
    .footer-tip {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      margin-top: 36px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
<div class="page">
  <div class="inner">
    <div class="glow"></div>
    <div class="hero">
      <div class="badge">🤖 ZuoSuo AI 数字人口播</div>
      <h1>一张照片<br/>变身带货主播</h1>
      <p>
        上传 <span class="hl">1 张照片</span> + <span class="hl">一段文案</span><br/>
        AI 全自动生成数字人口播视频<br/>
        <span style="color:rgba(255,255,255,0.25);font-size:13px;">无需真人出镜 · 无需拍摄 · 无需剪辑</span>
      </p>
    </div>
    <div class="sell-items">
      <div class="sell-item yellow">
        <span class="ico">📱</span>
        <span>不会写文案？粘贴抖音/快手/小红书<br/>链接 → <strong>一键提取文案</strong></span>
      </div>
      <div class="sell-item purple">
        <span class="ico">✨</span>
        <span>文案太平淡？<strong>AI 一键改写</strong><br/>让表达更吸引人、更有感染力</span>
      </div>
    </div>
    <div class="footer-tip">ZuoSuo AI · AI 驱动数字人口播</div>
  </div>
</div>
</body>
</html>
